name: CI/CD

# main only: the same checks as every branch (ci.yml, called — not copied),
# then the image is published to GHCR and deployed to the VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run on main: a newer push must not stop a deploy halfway.
# Runs queue instead, so releases go out in order.
concurrency:
  group: ci-cd-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/paulolnobre/converge-agent

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      skip-image: true

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged by commit, so a deploy names exactly what it runs and a rollback
      # is the previous tag. `main` is only a convenience pointer.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: publish
    # DEPLOY_ENABLED is a repository variable, set once the VPS is bootstrapped
    # (deploy/bootstrap.sh). Until then main publishes the image and stops.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VPS: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      # The host key is pinned, never accepted on first sight: a deploy that
      # would talk to whatever answers at that address is how secrets leak.
      - name: SSH credentials
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The files the server needs beside the image. Its .env is never touched.
      - name: Ship files
        run: |
          # staff.json is not in git and lives only on the server: excluded, so
          # --delete leaves it alone.
          rsync -a --delete --exclude staff.json content/ "$VPS:/opt/converge-agent/content/"
          rsync -a infra/init.sql "$VPS:/opt/converge-agent/infra/init.sql"
          rsync -a deploy/docker-compose.prod.yml "$VPS:/opt/converge-agent/docker-compose.yml"
          # The encrypted-volume override: in effect only with COMPOSE_FILE in
          # the server's .env. The unlock scripts are installed once by
          # luks/install.sh (as root).
          rsync -a deploy/docker-compose.encrypted.yml "$VPS:/opt/converge-agent/docker-compose.encrypted.yml"
          rsync -a deploy/luks/ "$VPS:/opt/converge-agent/luks/"
          rsync -a deploy/deploy.sh "$VPS:/opt/converge-agent/deploy.sh"
          rsync -a deploy/admin-monitor.sh "$VPS:/opt/converge-agent/admin-monitor.sh"
          rsync -a deploy/docker-compose.monitor.yml "$VPS:/opt/converge-agent/docker-compose.monitor.yml"
          # Prometheus and Grafana: in effect only with the overlay in COMPOSE_FILE.
          rsync -a deploy/docker-compose.observability.yml "$VPS:/opt/converge-agent/docker-compose.observability.yml"
          rsync -a --delete deploy/observability/ "$VPS:/opt/converge-agent/observability/"
          rsync -a deploy/observability.sh "$VPS:/opt/converge-agent/observability.sh"
          # Adds the field-encryption keys to .env once; run by hand (as deploy).
          rsync -a deploy/data-keys.sh "$VPS:/opt/converge-agent/data-keys.sh"
          # Adds the Web Push (VAPID) keys to .env once; run by hand (as deploy).
          rsync -a deploy/push-keys.sh "$VPS:/opt/converge-agent/push-keys.sh"
          # backup.sh also backs up the other stacks on this server (its timer
          # runs it from here); backup-install.sh and the units are run once.
          rsync -a deploy/backup.sh deploy/backup-install.sh "$VPS:/opt/converge-agent/"
          rsync -a deploy/systemd/ "$VPS:/opt/converge-agent/systemd/"

      - name: Release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS" \
            "GHCR_USER=${{ github.actor }} /opt/converge-agent/deploy.sh ${{ needs.publish.outputs.tag }}"
