name: CI

# Every branch except main, and every PR: the checks, and a build of the image
# to catch a broken Dockerfile — nothing is published, nothing deployed.
# ci-cd.yml runs this same workflow first on main, so the gate is one file.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-image:
        description: Skip the image build check (ci-cd.yml builds it itself)
        type: boolean
        default: false

concurrency:
  # Called from ci-cd.yml this group would be the caller's, so it is keyed on
  # the workflow too; a newer push to a branch cancels the stale run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret removed in a later commit is still in the repo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The same rules as the local pre-commit hook (.gitleaks.toml). The hook
      # can be skipped with --no-verify or missing on a new clone; this cannot.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep linux_x64.tar.gz "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pyright is pinned: an unpinned upgrade adds checks and fails CI on a
          # commit that changed nothing. Raise it deliberately.
          pip install pytest pytest-asyncio ruff pyright==1.1.411

      - name: Lint
        run: ruff check .

      # Ruff is type-blind. This is the gate that catches an Optional reaching a
      # call that cannot take None, which reads fine and fails at runtime.
      - name: Type check
        run: pyright

      # No .env is present here, and the suite depends on that: the LLM gateway
      # tests assert the behaviour when no API key is configured.
      - name: Audio codec tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Test
        run: pytest

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    # Phrased as "skip", not "build": outside workflow_call `inputs` is empty,
    # and an empty value compares equal to false — "build != false" would
    # quietly skip the build on every branch.
    if: ${{ !inputs.skip-image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: converge-ci:ocr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Local OCR with synthetic images and PDFs
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /dev/shm:rw,noexec,nosuid,size=96m
          -i --entrypoint python converge-ci:ocr-check - < tests/ocr_image_smoke.py

      - name: Staff attachment codecs in the image
        run: >-
          docker run --rm --network none --read-only --memory 512m --pids-limit 64
          -i --entrypoint python converge-ci:ocr-check - < tests/upload_image_smoke.py
