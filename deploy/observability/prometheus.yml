# What Prometheus collects, every 30 seconds, kept 30 days (or 2 GB).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: bot            # core/metrics.py: requests, queue, AI, errors
    static_configs:
      - targets: ["reception-bot:8000"]
  - job_name: node           # the server: CPU, memory, disk, network
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
