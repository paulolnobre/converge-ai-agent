# Questions for calibrating KNOWLEDGE_MIN_SIMILARITY — see cli/calibrate_knowledge.py.
#
# Written the way people actually type: short, informal, sometimes misspelled.
# `expect` is the start of the FAQ heading that should answer it, or "" when
# the FAQ does not cover it and the desk must say it does not know.
#
# Replace these with real questions from the conversations as they arrive —
# the roadmap's bar is 20 real ones.

